<svg xmlns="http://www.w3.org/2000/svg" width="520" height="520" viewBox="0 0 520 520">
  <defs>
    <linearGradient id="bg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f7f7f7"/>
      <stop offset="100%" stop-color="#ececec"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" x2="1">
      <stop offset="0%" stop-color="#1d5fd9"/>
      <stop offset="50%" stop-color="#0a5bd4"/>
      <stop offset="100%" stop-color="#0a2a8b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#8cc9ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8cc9ff" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="520" height="520" fill="url(#bg)"/>

  <g filter="url(#shadow)" transform="translate(80 38)">
    <rect x="110" y="20" width="120" height="420" rx="20" fill="#1b6fe4" opacity="0.15"/>

    <rect x="90" y="0" width="160" height="440" rx="48" fill="url(#metal)"/>
    <rect x="104" y="16" width="132" height="408" rx="38" fill="url(#glass)"/>

    <rect x="116" y="22" width="108" height="20" rx="8" fill="#1a90ff" opacity="0.7"/>
    <rect x="116" y="392" width="108" height="16" rx="8" fill="#0d1d70" opacity="0.45"/>

    <g transform="translate(0 40)">
      <text x="170" y="180" text-anchor="middle" font-size="14" font-family="Arial, Helvetica, sans-serif" fill="#eaf7ff" font-weight="bold" letter-spacing="1">INR18650 3.7V 12.5Ah</text>
      <text x="170" y="210" text-anchor="middle" font-size="34" font-family="Arial, Helvetica, sans-serif" fill="#f1f9ff" font-weight="700">10A MAX</text>
      <text x="170" y="250" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#edf6ff" font-weight="700">3500mAh</text>
      <text x="170" y="285" text-anchor="middle" font-size="22" font-family="Arial, Helvetica, sans-serif" fill="#edf6ff" font-weight="700">Li-ion</text>
      <text x="170" y="325" text-anchor="middle" font-size="18" font-family="Arial, Helvetica, sans-serif" fill="#eaf7ff" letter-spacing="2">VCLUB</text>
    </g>

    <g transform="translate(0 0)">
      <circle cx="170" cy="54" r="16" fill="#dfefff" opacity="0.9"/>
      <circle cx="170" cy="54" r="8" fill="#1d5fd9" opacity="0.9"/>
      <circle cx="170" cy="54" r="5" fill="#ffffff" opacity="0.9"/>
    </g>

    <g transform="translate(0 0)">
      <line x1="176" y1="122" x2="176" y2="4" stroke="#dfeaff" stroke-width="3" opacity="0.65"/>
      <line x1="184" y1="110" x2="184" y2="0" stroke="#dfeaff" stroke-width="2" opacity="0.4"/>
    </g>
  </g>
</svg>
